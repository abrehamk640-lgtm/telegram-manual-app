<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Make admin password</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#1C1C1E}input,button,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:8px 0}button{background:#FFC107;border:0;font-weight:700;cursor:pointer}textarea{font-family:ui-monospace,monospace;font-size:.8rem;min-height:90px}</style></head>
<body>
<h1>Admin password maker</h1>
<p>Type your admin password. This page works on your device only and sends nothing anywhere. Copy the result into <b>data/config.js</b>.</p>
<input id="pw" type="password" placeholder="Choose a long password" autocomplete="off">
<button id="go">Make it</button>
<textarea id="out" readonly placeholder="Result appears here"></textarea>
<button id="copy">Copy</button>
<script>
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
document.getElementById('go').onclick=async()=>{
  const pw=document.getElementById('pw').value; if(pw.length<6){out.value='Use at least 6 characters (12+ is better).';return;}
  const salt=crypto.getRandomValues(new Uint8Array(16)), iter=200000;
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},key,256);
  out.value="export const ADMIN_PASSWORD_HASH = 'pbkdf2$"+iter+"$"+hex(salt)+"$"+hex(bits)+"';";
};
document.getElementById('copy').onclick=()=>{out.select();document.execCommand('copy');};
</script></body></html>
